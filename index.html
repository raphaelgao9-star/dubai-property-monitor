<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Townhouse 投资监测仪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6 md:p-10">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 头部信息 -->
        <div class="flex justify-between items-end border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">我的房产投资组合</h1>
                <p class="text-gray-500 mt-1">坐标: Mudon Arabella 3 | 户型: 3 Bedroom Townhouse</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500">买入价格</p>
                <p class="text-2xl font-bold text-blue-600">AED 2,700,000</p>
            </div>
        </div>

        <!-- ⚠️ 预警模块 -->
        <div id="alertBanner" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-md shadow-sm transition-all">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">系统提示 / 市场预警</h3>
                    <p id="alertMessage" class="mt-2 text-sm text-red-700"></p>
                </div>
            </div>
        </div>

        <!-- 市场数据卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Arabella 3房当前均价</h3>
                <p id="arabellaSale" class="text-2xl font-bold mt-2">加载中...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Arabella 3房平均年租金</h3>
                <p id="arabellaRent" class="text-2xl font-bold mt-2">加载中...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">当前毛租金收益率 (Gross Yield)</h3>
                <p id="arabellaYield" class="text-2xl font-bold mt-2">加载中...</p>
            </div>
        </div>

        <!-- 竞品对比与散点图 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4">周边社区竞品对比</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm">
                        <thead class="border-b bg-gray-50">
                            <tr>
                                <th class="px-4 py-3">社区 (3房联排)</th>
                                <th class="px-4 py-3">近期均价 (AED)</th>
                                <th class="px-4 py-3">平均租金 (AED)</th>
                                <th class="px-4 py-3">租售比</th>
                            </tr>
                        </thead>
                        <tbody id="comparisonTable" class="divide-y">
                            <!-- 数据由JS渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4">Arabella 售价-租金 散点与拟合曲线</h2>
                <canvas id="scatterChart" height="250"></canvas>
            </div>
        </div>
    </div>

    <script>
        const alertThreshold = 0.06; // 6% 预警
        const formatAED = (num) => 'AED ' + num.toLocaleString();
        
        // 社区对比数据
        const simulatedMarketData = [
            { id: 'arabella', name: 'Mudon Arabella', sale: 2850000, rent: 165000, last_updated: new Date().toLocaleDateString() },
            { id: 'lagoons', name: 'Damac Lagoons', sale: 2600000, rent: 145000 },
            { id: 'ar3', name: 'Arabian Ranches 3', sale: 2800000, rent: 160000 }
        ];

        // 散点图的样本数据 (近期 Arabella 3房的真实或模拟成交/出租组合)
        // X轴为售价，Y轴为租金
        const scatterPoints = [
            { x: 2650000, y: 155000 },
            { x: 2700000, y: 162000 }, // 你的基准成本附近
            { x: 2750000, y: 160000 },
            { x: 2800000, y: 168000 },
            { x: 2850000, y: 165000 },
            { x: 2900000, y: 175000 },
            { x: 2950000, y: 172000 },
            { x: 3000000, y: 180000 }
        ];

        // 线性回归计算公式 (最小二乘法)
        function calculateLinearRegression(data) {
            let n = data.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            
            data.forEach(point => {
                sumX += point.x;
                sumY += point.y;
                sumXY += point.x * point.y;
                sumXX += point.x * point.x;
            });

            const m = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const b = (sumY - m * sumX) / n;
            return { m, b };
        }

        function loadMarketData() {
            renderDashboard(simulatedMarketData);
            renderScatterChart();
        }

        function renderDashboard(marketData) {
            const arabellaData = marketData.find(d => d.id === 'arabella');
            if (!arabellaData) return;

            const currentYield = arabellaData.rent / arabellaData.sale;

            document.getElementById('arabellaSale').innerText = formatAED(arabellaData.sale);
            document.getElementById('arabellaRent').innerText = formatAED(arabellaData.rent);
            
            const yieldElement = document.getElementById('arabellaYield');
            yieldElement.innerText = (currentYield * 100).toFixed(2) + '%';
            
            if (currentYield < alertThreshold) {
                document.getElementById('alertBanner').classList.remove('hidden');
                yieldElement.classList.add('text-red-600');
                document.getElementById('alertMessage').innerText = 
                    `注意：目前 Arabella 的市场租售比已降至 ${(currentYield * 100).toFixed(2)}%。`;
            } else {
                yieldElement.classList.add('text-green-600');
            }

            const tableBody = document.getElementById('comparisonTable');
            tableBody.innerHTML = ''; 
            
            marketData.forEach(item => {
                const itemYield = (item.rent / item.sale * 100).toFixed(2);
                let rowHtml = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 font-medium ${item.id === 'arabella' ? 'text-blue-600' : ''}">${item.name}</td>
                        <td class="px-4 py-3">${formatAED(item.sale)}</td>
                        <td class="px-4 py-3">${formatAED(item.rent)}</td>
                        <td class="px-4 py-3 font-bold ${itemYield < 6 ? 'text-red-500' : 'text-green-600'}">${itemYield}%</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        function renderScatterChart() {
            const ctx = document.getElementById('scatterChart').getContext('2d');
            
            // 计算线性拟合参数
            const { m, b } = calculateLinearRegression(scatterPoints);
            
            // 获取 X 轴的极值以绘制横跨图表的直线
            const minX = Math.min(...scatterPoints.map(p => p.x));
            const maxX = Math.max(...scatterPoints.map(p => p.x));
            
            const lineData = [
                { x: minX, y: m * minX + b },
                { x: maxX, y: m * maxX + b }
            ];

            // 你的房产标记点 (假设按270万买入价，租金暂计均值)
            const myProperty = { x: 2700000, y: m * 2700000 + b };

            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            type: 'scatter',
                            label: '近期市场样本点',
                            data: scatterPoints,
                            backgroundColor: 'rgba(59, 130, 246, 0.7)',
                            pointRadius: 5
                        },
                        {
                            type: 'line',
                            label: '租售收益拟合线',
                            data: lineData,
                            borderColor: 'rgba(239, 68, 68, 0.8)', // 红色虚线
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        },
                        {
                            type: 'scatter',
                            label: '你的持有成本 (2.7M)',
                            data: [myProperty],
                            backgroundColor: 'rgba(16, 185, 129, 1)', // 绿色高亮
                            pointStyle: 'rectRot', // 菱形图标
                            pointRadius: 8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `售价: ${context.parsed.x.toLocaleString()} AED | 租金: ${context.parsed.y.toLocaleString()} AED`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: '售价 (AED)' },
                            ticks: {
                                callback: function(value) {
                                    return (value / 1000000).toFixed(1) + 'M'; // 显示为 2.7M 格式
                                }
                            }
                        },
                        y: {
                            title: { display: true, text: '年租金 (AED)' },
                            ticks: {
                                callback: function(value) {
                                    return (value / 1000) + 'K'; // 显示为 150K 格式
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = loadMarketData;
    </script>
</body>
</html>
